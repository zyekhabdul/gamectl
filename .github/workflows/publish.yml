name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gamectl
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build standalone gamectl bundle
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh
          test -f src/gamectl_runner/bin/gamectl

      - name: Build distribution packages
        run: python -m build

      - name: Verify wheel contents
        run: |
          python -m wheel unpack dist/*.whl -d /tmp/whl_check
          test -f /tmp/whl_check/*/gamectl_runner/bin/gamectl
          /tmp/whl_check/*/gamectl_runner/bin/gamectl --version
          rm -rf /tmp/whl_check

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
