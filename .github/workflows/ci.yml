name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Build & Regression Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fzf \
            jq \
            file \
            rsync \
            zip \
            unzip \
            p7zip-full \
            bubblewrap

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/depot-dl/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/depot-dl/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Validate Bash syntax (make lint)
        run: make lint

      - name: Verify source-to-bundle synchronization
        run: ./scripts/build.sh --check

      - name: Execute Rust depot-dl crate test suite
        run: cargo test --manifest-path crates/depot-dl/Cargo.toml --verbose

      - name: Compile native depot downloader binary
        run: ./scripts/build-depot-dl.sh

      - name: Execute CLI regression and integrity harness
        run: ./tests/test_cli.sh
