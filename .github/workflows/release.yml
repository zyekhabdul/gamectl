name: Release Automation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-depot-dl:
    name: Build Multi-Arch Release Assets (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fzf jq file rsync zip unzip p7zip-full dpkg-dev binutils

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile standalone gamectl bundle
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Compile native Rust depot downloader
        run: |
          cargo build --locked --release --manifest-path crates/depot-dl/Cargo.toml --bin gamectl-depot-dl
          mkdir -p bin
          cp -f crates/depot-dl/target/release/gamectl-depot-dl bin/gamectl-depot-dl
          chmod +x bin/gamectl-depot-dl
          strip bin/gamectl-depot-dl || true

      - name: Build Debian (.deb) package
        run: bash packaging/debian/build-deb.sh

      - name: Stage arch-specific artifacts
        run: |
          mkdir -p dist-arch
          cp -f bin/gamectl-depot-dl "dist-arch/gamectl-depot-dl-linux-${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp -f bin/gamectl-depot-dl dist-arch/gamectl-depot-dl
          fi
          cp -f packaging/debian/*.deb dist-arch/

      - name: Upload arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: dist-arch/*

  build-release:
    name: Stage Checksums & Publish GitHub Release
    needs: build-depot-dl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile standalone gamectl bundle
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Download multi-arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Stage release artifacts & generate SHA256 checksums
        run: |
          cp -f bin/gamectl dist/gamectl
          rm -f dist/SHA256SUMS
          cd dist
          sha256sum * > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gamectl
            dist/gamectl-depot-dl
            dist/gamectl-depot-dl-linux-x86_64
            dist/gamectl-depot-dl-linux-aarch64
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
